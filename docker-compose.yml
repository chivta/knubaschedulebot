# Local development only. Never used for staging or production.
services:
  knubaschedulebot:
    build:
      context: .
      target: dev
    env_file: .env
    environment:
      DB_PATH: /app/data/knubaschedulebot.db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
      - knubaschedulebot-data:/app/data
    ports:
      - "8080:8080"
    depends_on: [redis]

  redis:
    image: redis:8.10-alpine

volumes:
  knubaschedulebot-data:
