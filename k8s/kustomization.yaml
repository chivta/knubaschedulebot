apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: knubaschedulebot

resources:
  - namespace.yaml
  # SOPS-encrypted; Flux decrypts it in-cluster. Edit k8s/secrets.yaml
  # (gitignored) and re-run `sops -e k8s/secrets.yaml > k8s/secrets.enc.yaml`
  # to change a value.
  - secrets.enc.yaml
  - bot/pvc.yaml
  - bot/deployment.yaml
  - bot/service-monitor.yaml
  - redis/statefulset.yaml
