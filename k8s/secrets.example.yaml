# Copy to k8s/secrets.yaml (gitignored), fill in the real values, then commit
# only the encrypted form:
#
#   sops -e k8s/secrets.yaml > k8s/secrets.enc.yaml
#
# Everything the bot reads from the environment that is secret belongs here.
# Non-secret settings go in the deployment's env: block instead.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: knubaschedulebot
stringData:
  # Telegram bot token from @BotFather.
  BOT_TOKEN: "replace"
  # Comma-separated Telegram user IDs of the admins.
  ADMIN_IDS: "replace"
